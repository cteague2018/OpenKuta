# OpenMathForge Production Automated Quality Gates
name: OpenMathForge Production Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-types:
    name: Static Analysis, Security & Strict Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Headless System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies & Type Checkers
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install mypy ruff pip-audit

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: "Gate 1: Secrets Scanning (Gitleaks & Internal Scanner)"
        run: |
          python scripts/detect-secrets.py

      - name: "Gate 2: Dependency Audit & Manifest SCA"
        run: |
          pip-audit --desc || echo "pip-audit completed with warnings."
          cd frontend && npm audit --audit-level=critical || true

      - name: "Gate 3: Python Strict Typing (mypy)"
        run: |
          python -m mypy backend/app

      - name: "Gate 4: TypeScript Strict Typing (tsc --noEmit)"
        working-directory: frontend
        run: npm run type-check

      - name: "Gate 5: Ruff Linter & Dead Code Analysis"
        run: |
          python -m ruff check backend

  math-truth-and-cv:
    name: Math Truth CAS & Computer Vision Stress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Headless System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Typst CLI Binary
        uses: typst-community/setup-typst@v3
        with:
          typst-version: "0.11.0"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install hypothesis

      - name: "Gate 6: Math Truth Engine & SymPy Identity Verification"
        run: |
          python -m pytest tests/functional/test_math_truth.py -v

      - name: "Gate 6.1: Universal Generator Sweep & Visual Typographic Linter"
        run: |
          python -m pytest backend/tests/test_all_generators_visual_sweep.py backend/tests/test_svg_geometry_rendering.py -v

      - name: "Gate 7: Typst Document Rendering & Multi-Page Layout Integrity"
        run: |
          python -m pytest tests/functional/test_document_render.py -v

      - name: "Gate 8: OpenCV Matrix Alignment & Fiducial Resilience"
        run: |
          python -m pytest tests/vision/test_cv_engine.py -v

  security-and-governance:
    name: Security, IDOR Defense & FERPA/COPPA Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Headless System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: "Gate 9: BOLA/IDOR, FERPA Lifecycle & Adversarial Uploads"
        run: |
          python -m pytest tests/security/test_security_governance.py -v

  e2e-playwright:
    name: Headless Browser E2E Workflows (Playwright)
    needs: [audit-and-types, math-truth-and-cv, security-and-governance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Headless System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Install Frontend Dependencies & Build Next.js
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Start FastAPI Backend
        run: |
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          sleep 3
          curl -f http://127.0.0.1:8000/health || cat backend.log

      - name: Start Next.js Frontend Server
        working-directory: frontend
        run: |
          nohup npm run start -- -p 3000 > frontend.log 2>&1 &
          sleep 4
          curl -f http://127.0.0.1:3000 || cat frontend.log

      - name: "Gate 10: Run Playwright E2E UI Workflows"
        run: |
          CI=true FRONTEND_URL=http://127.0.0.1:3000 python -m pytest tests/e2e/test_ui_workflows.py -v

  quality-gate-status:
    name: Quality Gate Summary & Branch Protection
    needs: [audit-and-types, math-truth-and-cv, security-and-governance, e2e-playwright]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify All Quality Gates Passed
        run: |
          if [[ "${{ needs.audit-and-types.result }}" != "success" || \
                "${{ needs.math-truth-and-cv.result }}" != "success" || \
                "${{ needs.security-and-governance.result }}" != "success" || \
                "${{ needs.e2e-playwright.result }}" != "success" ]]; then
            echo "::error::One or more production verification gates failed. Merging is blocked."
            exit 1
          fi
          echo "All production verification gates passed cleanly with zero defects."
