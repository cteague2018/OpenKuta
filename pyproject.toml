[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openmathforge"
version = "0.1.0"
description = "Deterministic math worksheet generation and CV grading engine"
authors = [{ name = "OpenMathForge Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "sympy>=1.12",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "typst>=0.11.0",
    "jinja2>=3.1.0",
    "qrcode[pil]>=7.4.2",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = [".", "backend"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = false
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "sympy.*",
    "cv2.*",
    "qrcode.*",
    "typst.*",
    "jinja2.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008"]

