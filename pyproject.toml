[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openkuta"
version = "0.1.0"
description = "Deterministic math worksheet generation and CV grading engine"
authors = [{ name = "OpenKuta Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "sympy>=1.12",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "typst>=0.11.0",
    "jinja2>=3.1.0",
    "qrcode[pil]>=7.4.2",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

